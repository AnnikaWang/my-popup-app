<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nekoMood</title>
    <!-- FIXED: Links to standard styles.css name -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="window-container">
        <!-- Custom Mac Style Top Bar -->
        <div class="title-bar">
            <div class="dots-container">
                <span class="dot close"></span>
                <span class="dot minimize"></span>
                <span class="dot maximize"></span>
            </div>
        </div>

        <!-- App Main Frame Content Area -->
        <div class="app-body">
            <div class="brand">nekomood</div>

            <!-- ==========================================
                VIEW 1: Home App Frame (Starts Active)
                ========================================== -->
            <div id="home-screen" class="view-panel">
                <!-- Top Navigation Row -->
                <div class="top-nav">
                    <div class="nav-icon active" id="home-profile-nav">
                        <img src="assets/home.jpg" alt="Home">
                    </div>
                    <div class="nav-icon" id="profile-plus-nav">
                        <img src="assets/plus.jpg" alt="Plus">
                    </div>
                    <div class="nav-icon">
                        <img src="assets/book.jpg" alt="Book">
                    </div>
                    <div class="nav-icon">
                        <img src="assets/brain.jpg" alt="Brain">
                    </div>
                </div>

                <!-- SUB-VIEW A: The Initial Mood Picker Input Frame -->
                <div class="mood-selection-view">
                    <div class="mood-bubble">
                        <h2 class="mood-title">Mood Scale</h2>
                        <p class="mood-subtitle">What meme are you feeling today?</p>
                        
                        <div class="meme-grid">
                            <div class="meme-box" onclick="selectMeme(this)" data-meaning="happy"><img src="assets/happy.jpg" alt="Happy"></div>
                            <div class="meme-box" onclick="selectMeme(this)" data-meaning="dizzy"><img src="assets/dizzy.jpg" alt="Dizzy"></div>
                            <div class="meme-box" onclick="selectMeme(this)" data-meaning="angry"><img src="assets/angry.jpg" alt="Angry"></div>
                            <div class="meme-box" onclick="selectMeme(this)" data-meaning="crying"><img src="assets/crying.jpg" alt="Crying"></div>
                            <div class="meme-box" onclick="selectMeme(this)" data-meaning="burnout"><img src="assets/fire.jpg" alt="Fire"></div>
                        </div>

                        <button type="button" class="bubble-save-btn" id="bubble-save-btn">Save</button>
                    </div>

                    <div class="cat-companion">
                        <img src="assets/black-cat.png" alt="Nekomood Cat">
                    </div>
                </div>

                <!-- NEW SUB-VIEW B: Daily Affirmation Response Display (Starts Hidden) -->
                <div class="saved-affirmation-view hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center;" >
                    <div class="mood-bubble">
                        <h2 class="mood-title" style="font-family: inherit; font-weight: normal; margin-bottom: 5px;">Daily Affirmation:</h2>
                        
                        <!-- White layout card box for your inner text content selection -->
                        <div class="affirmation-text-box">
                            "I am free to make mistakes"
                        </div>
                    </div>

                    <!-- The black companion kitten stays right at the speech bubble tail context -->
                    <div class="cat-companion">
                        <img src="assets/black-cat.png" alt="Nekomood Cat">
                    </div>
                </div>

            </div>


            <!-- ==========================================
                 VIEW 2: Profile Dashboard App Frame (Hidden)
                 ========================================== -->
            <div id="profile-screen" class="view-panel hidden">
                <!-- Replace your top-nav sections with this clean image structure -->
                <div class="top-nav">
                    <!-- Update the home icon wrapper on EVERY screen to include the class: nav-home-btn -->
                    <div class="nav-icon nav-home-btn">
                        <img src="assets/home.jpg" alt="Home">
                    </div>
                    <div class="nav-icon" id="profile-plus-nav"><img src="assets/plus.jpg" alt="Plus"></div>
                    <div><img src="assets/book.jpg" alt="Book" class="nav-icon"></div>
                    <div><img src="assets/brain.jpg" alt="Brain" class="nav-icon"></div>
                </div>


                <div class="profile-header">
                    <!-- ADDED ID HERE: To change its inner contents dynamically -->
                    <div class="profile-avatar" id="profile-avatar-container">
                        <span class="avatar-icon">👤</span>
                    </div>
                    <div class="profile-meta">
                        <h2 id="display-username">[Username]</h2>
                        <button type="button" class="edit-profile-btn" id="edit-profile-btn">✏️ Edit Profile</button>
                    </div>
                </div>
                    
                <!-- Clear and isolated interest input layout wrapper cards -->
                <div class="info-card unique-profile-card">
                    <h3>Interested In</h3>
                    
                    <!-- Form actions row container holds fields securely -->
                    <div class="interest-entry-box">
                        <input type="text" id="direct-interest-input" placeholder="Type a new topic here..." autocomplete="off">
                        <button type="button" id="add-interest-btn">Add</button>
                    </div>
                    
                    <ul id="interests-list" class="punchy-list" style="margin: 0; padding-left: 20px; text-align: left;"></ul>
                    
                    <!-- Decorative striped cat mascot graphic layered independently -->
                    <div class="card-cat-deco">
                        <img src="assets/striped-cat.png" alt="Cat Decoration">
                    </div>
                </div>


                <div class="info-card log-card">
                    <h3>Log</h3>
                    <!-- The JavaScript script targets this ID below to add new lines dynamically -->
                    <div id="log-container" style="display: flex; flex-direction: column; gap: 8px;">
                        <div class="log-entry"></div>
                    </div>
                </div>

            </div> <!-- Close #profile-screen --> 

            <!-- ==========================================
                VIEW 3: Affirmation Screen Frame (Hidden)
                ========================================== -->
            <div id="affirmation-screen" class="view-panel hidden">
                
                <!-- CHANGED: Unique class name isolates this navbar from all other views -->
                <div class="affirmation-nav">
                    <div class="nav-bar-container">
                        <!-- Update the home icon wrapper on EVERY screen to include the class: nav-home-btn -->
                        <div class="nav-icon nav-home-btn">
                            <img src="assets/home.jpg" alt="Home">
                        </div>
                        <div class="nav-icon active-nav" id="profile-plus-nav">
                            <img src="assets/plus.jpg" alt="Plus">
                        </div>
                        <div class="nav-icon">
                            <img src="assets/book.jpg" alt="Book">
                        </div>
                        <div class="nav-icon">
                            <img src="assets/brain.jpg" alt="Brain">
                        </div>
                    </div>
                </div>

                <!-- Centered White Affirmation Content Card -->
                <div class="affirmation-card">
                    <div class="siamese-cat-deco">
                        <img src="assets/siamese-cat.png" alt="Siamese Cat Companion">
                    </div>
                    
                    <h2>Add your affirmation:</h2>
                    <textarea class="affirmation-input-box" placeholder="[insert affirmation]"></textarea>
                    <button id="save-affirmation-btn" class="save-btn">Save</button>
                </div>

            </div>



            <!-- ==========================================
                VIEW 4: RESOURCES & SUPPORT SCREEN
                ========================================== -->
            <div id="resources-screen" class="view-panel hidden">
                
                <!-- Top Navigation Panel Structure -->
                <div class="header-container" style="display: flex; justify-content: space-between; align-items: center; width: 100%; padding-bottom: 15px;">
                    <!-- Left empty placeholder pushes navbar menu cleanly to the right side -->
                    <div></div>
                    
                    <div class="top-nav">
                        <!-- FIXED: Stripped duplicate active states so only the Book icon shines -->
                        <!-- Update the home icon wrapper on EVERY screen to include the class: nav-home-btn -->
                        <div class="nav-icon nav-home-btn">
                            <img src="assets/home.jpg" alt="Home">
                        </div>
                        <div class="nav-icon" id="res-plus-nav">
                            <img src="assets/plus.jpg" alt="Plus">
                        </div>
                        <div class="nav-icon active">
                            <img src="assets/book.jpg" alt="Book">
                        </div>
                        <div class="nav-icon">
                            <img src="assets/brain.jpg" alt="Brain">
                        </div>
                    </div>
                </div>

                <!-- Pixel Art Chat Bubble Layout -->
                <div class="pixel-bubble-container">
                    <div class="pixel-bubble">
                        <span class="bubble-text">xoxo</span>
                    </div>
                </div>

                <!-- Rounded Menu Category Buttons inside #resources-screen -->
                <div class="category-menu">
                    <button type="button" class="menu-item-btn external-link" data-url="https://www.nimh.nih.gov">Mental Health Conditions</button>
                    <button type="button" class="menu-item-btn external-link" data-url="https://www.nih.gov/health-information/your-healthiest-self-wellness-toolkits">Life and Wellness Topics</button>
                    <button type="button" class="menu-item-btn external-link" data-url="https://www.psychiatry.org/patients-families">Treatment and Support</button>
                </div>

            </div> <!-- Close #resources-screen --> 

            








            <!-- ==========================================================================
                REPAIRED PROFILE DIALOG MODAL (INSIDE APP-BODY SIBLING LAYERS)
                ========================================================================== -->
            <div id="input-modal" class="hidden" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: flex; justify-content: center; align-items: center; z-index: 10;">
                <div class="window-container" style="width: 85%; height: auto; background: #fff0f2; padding: 20px; border-radius: 20px; border: 3px solid #333333; box-shadow: none;">
                    <h3 style="margin-top: 0; text-align: center; font-size: 20px;">Modify Settings</h3>
                    
                    <!-- Text update input field -->
                    <div class="input-group" style="margin-bottom: 12px; display: flex; flex-direction: column;">
                        <label style="margin-bottom: 4px; font-weight: 500;">Update Name:</label>
                        <input type="text" id="username-input" style="height: 36px; border: 2px solid #333333; border-radius: 18px; padding: 0 12px; outline: none;">
                    </div>
                    
                    <!-- File uploader input field for image selections -->
                    <div class="input-group" style="margin-bottom: 20px; display: flex; flex-direction: column;">
                        <label style="margin-bottom: 4px; font-weight: 500;">Change Profile Picture:</label>
                        <input type="file" id="avatar-file-input" accept="image/jpeg, image/jpg, image/png" style="font-size: 14px;">
                    </div>
                    
                    <!-- FIXED: Button classes updated to generic utility buttons to avoid stylesheet collisions -->
                    <div style="display: flex; gap: 10px;">
                        <button id="save-profile-btn" style="flex: 1; height: 38px; font-size: 14px; background-color: #ffd1d6; border: 2px solid #333333; border-radius: 19px; cursor: pointer; font-weight: 500;">Save</button>
                        <button id="close-modal-btn" style="flex: 1; height: 38px; font-size: 14px; background-color: #cccccc; border: 2px solid #333333; border-radius: 19px; cursor: pointer; font-weight: 500;">Cancel</button>
                    </div>
                </div>
            </div>


        </div> <!-- Close .app-body -->
    </div> <!-- Close .window-container -->

    <!-- FIXED: Links to script.js directly -->
    <script src="script.js"></script>
</body>
</html>
